<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="64" y1="18" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Glowing Outer Shield -->
  <path d="M64 22L96 34V64C96 85 82 101 64 108C46 101 32 85 32 64V34L64 22Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Play Symbol & Checkmark -->
  <!-- Play Triangle -->
  <path d="M52 46L76 60L52 74V46Z" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Verified Checkmark below Play -->
  <path d="M56 82L62 88L74 76" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
